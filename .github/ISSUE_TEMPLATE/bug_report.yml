name: Bug 报告
description: 报告可以稳定复现的代码、文档或学习流程问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。中文和英文都可以。

        如果问题可能涉及安全漏洞，请不要继续填写公开 Issue，改用[私密漏洞报告](https://github.com/likebeans/temporal4l/security/advisories/new)。提交前请删除令牌、Cookie、`.env` 内容、个人数据和敏感 Payload。

  - type: input
    id: summary
    attributes:
      label: 问题摘要
      description: 用一句话说明哪里出了问题。
      placeholder: 例如：原生模式下创建订单后 Worker 无法连接 namespace
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      description: 请粘贴 `node --version` 的结果；项目要求 Node.js 22.13+，推荐 24 LTS。
      placeholder: v24.x.x
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: 操作系统
      description: 请包含系统名称、版本和架构。
      placeholder: macOS 15 arm64 / Ubuntu 24.04 x64 / Windows 11 WSL2
    validations:
      required: true

  - type: dropdown
    id: startup-mode
    attributes:
      label: 启动模式
      description: 选择发生问题时实际使用的模式。
      options:
        - 原生 Temporal（npm run temporal:local）
        - Docker Compose（npm run temporal:up）
        - 隔离自动化测试
        - 已有或远程 Temporal 服务
        - 其他
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 请从干净安装或明确的初始状态开始，列出实际执行的命令和操作。
      placeholder: |
        1. npm ci
        2. npm run temporal:local
        3. 在另一个终端运行 npm run dev
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你认为应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？请区分页面业务状态与 Temporal 执行状态。
    validations:
      required: true

  - type: textarea
    id: logs-and-evidence
    attributes:
      label: 必要日志与运行证据
      description: 请只附定位问题所需的错误栈、首个失败日志或相关 History 字段；若没有可用日志，请填写“无”并说明原因。
      placeholder: |
        请注明证据来自浏览器、API、Worker、Temporal UI、Query、Describe、History 或本地账本。
        不要粘贴令牌、Cookie、私钥、完整 .env、真实个人数据或敏感 Payload。
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 其他上下文
      description: 可选。包括相关提交、端口或环境变量改动，以及最小仓库链接或截图。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 Issue 和 Discussion，没有找到相同问题。
          required: true
        - label: 我已删除凭据、个人数据和不必要的敏感信息。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
